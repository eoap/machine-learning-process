[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlm"
description = "Describes a trained machine learning model"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
version="0.1.0"
keywords = ["pystac","MLM extension","inference","training", "Sentinel-2", "CNN", "EuroSAT"]
authors = [
    { name = "Parham Membari", email = "parham.membari@terradue.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pystac[validation] @ git+https://github.com/Terradue/pystac.git@t2_extensions",
  "loguru>=0.7,<1",
  "boto3>=1.35,<2",
  "folium>=0.18,<1",
  "pandas>=2.2,<3",
  "geopandas>=1,<2",
  "geojson>=3,<4",
  "tqdm>=4.66,<5",
  "requests>=2.32,<3",
  "pyproj>=3.6,<4"
]

[project.urls]
Documentation = "https://github.com/eoap/machine-learning-process/MLM#readme"
Issues = "https://github.com/eoap/machine-learning-process/issues"
Source = "https://github.com/eoap/machine-learning-process/"



[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.default]

[tool.hatch.envs.prod]
dependencies = ["ipykernel>=6,<7"]
[tool.hatch.build.targets.wheel]
packages = ["src/mlm"]

[[tool.hatch.envs.test.matrix]]
python = ["3.12"]

# Coverage settings
[tool.coverage.run]
branch = true
parallel = true



[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]