[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tile-based-training"
dynamic = ["version"]
description = "Training module for the Tile-Based classification on Sentinel-2 data"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
keywords = ["training", "Sentinel-2", "CNN", "EuroSAT"]
authors = [
    { name = "Parham Membari", email = "parham.membari@terradue.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
  "click>=8.1,<9",
  "pystac[validation] @ git+https://github.com/Terradue/pystac.git@t2_extensions",
  "pystac-client>=0.8,<1",
  "numpy==1.26.4",
  "scikit-learn>=1.5,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "joblib>=1.4,<2",
  "PyYAML>=6,<7",
  "python-box>=7,<8",
  "tensorflow==2.21.0",
  "mlflow==3.17.0",
  "seaborn>=0.13,<1",
  "rasterio>=1.4,<2",
  "loguru>=0.7,<1",
  "ensure>=1,<2",
  "tqdm>=4.66,<5",
  "duckdb>=1.1,<2",
  "shapely>=2,<3",
  "stac-geoparquet>=0.6,<1",
  "tzdata",
  "requests>=2.32,<3",
  "tf2onnx==1.17.0",
  "onnx==1.23.2",
  "pyarrow>=23.0.1,<26",
  "protobuf>=6.33.5,<8",
  "onnxruntime==1.31.0"
]

[project.urls]
Documentation = "https://eoap.github.io/machine-learning-process/training-container/"
Issues = "https://github.com/eoap/machine-learning-process/issues"
Source = "https://github.com/eoap/machine-learning-process/tree/main/training/make-ml-model"

[tool.hatch.version]
path = "src/tile_based_training/__about__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
packages = ["src/tile_based_training"]
include = [
  "src/tile_based_training/config/config.yaml",
  "src/tile_based_training/config/params.yaml",
  "*.yaml",
  "*.yml",
  "*.json",
  "config.yaml",
  "params.yaml",
  "output/data_ingestion/splitted_data.json"
]



[project.scripts]
tile-based-training = "tile_based_training.main:main"
export-ml-model = "tile_based_training.export:main"

[tool.hatch.envs.default]
dependencies = ["ipykernel>=6,<7"]

[tool.hatch.envs.prod]
dependencies = ["ipykernel>=6,<7"]

[tool.hatch.envs.prod.scripts]
train = "python -m tile_based_training.main"

[[tool.hatch.envs.test.matrix]]
python = ["3.12"]

# Coverage settings
[tool.coverage.run]
source_pkgs = ["tile_based_training"]
branch = true
parallel = true
omit = [
    "src/tile_based_training/__about__.py",
]

[tool.coverage.paths]
tile_based_training = ["src/tile_based_training", "*/tile_based_training/src/tile_based_training"]


[tool.hatch.build.targets.wheel]
packages = ["src/tile_based_training"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]