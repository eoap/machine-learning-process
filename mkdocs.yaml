site_name: Machine Learning Process
theme:
    name: material
    icon: 
      logo: fontawesome/solid/earth-europe

    palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

plugins:
  - search
  - mermaid2:
      version: 10.6.0

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list 
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Introduction: 'index.md'
  - How-to guides: 'hands-on.md'
  - Tutorials:
    - Application Packages: 'packages.md'
    - Run Training Module using CWL Runner: 'training-cwl.md'
    - Run Inference Module using CWL Runner: 'inference-cwl.md'
    - Describes a trained machine learning model: 'mlm.md'
  - Reference guides:
    - Training a Machine Learning Model: 
      - Container: 'training-container.md'
    - Run an inference on Real World data: 
      - Container: 'inference-container.md'
  - Development: 'development.md'
  - Release acceptance: 'release.md'
  - Development acceptance: 'acceptance.md'
  - Contracts:
    - Training: 'reference/tile-sat-training.md'
    - Inference: 'reference/tile-sat-inference.md'
  - Technical Insights and Learnings: 'insights.md'
  

copyright: Apache License 2.0
