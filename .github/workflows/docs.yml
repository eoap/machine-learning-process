name: Documentation
on:
  push:
    branches: [main, master]
    paths: ['docs/**', 'mkdocs.yaml', '.github/workflows/docs.yml', 'requirements/**']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --require-hashes -r requirements/development.txt
      - run: python scripts/check-contracts.py
      - run: python -m mkdocs build --strict
      - run: python -m mkdocs gh-deploy --force
