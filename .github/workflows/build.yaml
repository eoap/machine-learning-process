name: Release
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [candidate, stable]
        default: candidate
permissions:
  contents: read
concurrency:
  group: application-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  notebooks:
    uses: ./.github/workflows/notebook-acceptance.yml
  version:
    needs: [checks, notebooks]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          version=$(jq -er .version codemeta.json)
          grep -Fq "## [$version]" CHANGELOG.md
          if [[ "$CHANNEL" == candidate ]]; then
            version="$version-rc.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          else
            [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/master ]]
            python scripts/check-acceptance.py docs/acceptance/stable.json
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > /tmp/tags
          ! grep -Fxq "$version" /tmp/tags
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$version" --jq '.[].ref' > /tmp/refs
          ! grep -Fxq "refs/tags/$version" /tmp/refs
          echo "version=$version" >> "$GITHUB_OUTPUT"
  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        kind: [training, inference]
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
        with: {version: '1.3.0'}
      - name: Build and authenticate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          KIND: ${{ matrix.kind }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$KIND:$VERSION"
          if [[ "$CHANNEL" == stable ]]; then
            accepted=$(jq -er --arg kind "$KIND" '.images[$kind]' docs/acceptance/stable.json)
            [[ "$accepted" == "ghcr.io/${GITHUB_REPOSITORY,,}/$KIND@sha256:"* ]]
            docker pull "$accepted"
            echo "IMAGE_SCAN=$accepted" >> "$GITHUB_ENV"
          else
            package=make-inference
            [[ "$KIND" == inference ]] || package=make-ml-model
            docker build -f "$KIND/$package/Dockerfile" -t "$image" .
            echo "IMAGE_SCAN=$image" >> "$GITHUB_ENV"
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          version: 'v0.69.3'
          image-ref: ${{ env.IMAGE_SCAN }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: scan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ matrix.kind }}
          path: scan.json
      - name: Publish immutable image
        env:
          KIND: ${{ matrix.kind }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          repository="${IMAGE%:*}"
          oras repo tags "$repository" > /tmp/image-tags 2>/tmp/registry-error || {
            grep -Eq 'NAME_UNKNOWN|name unknown|404' /tmp/registry-error || { cat /tmp/registry-error; exit 1; }
          }
          ! grep -Fxq "$VERSION" /tmp/image-tags
          if [[ "$CHANNEL" == stable ]]; then
            oras cp "$IMAGE_SCAN" "$IMAGE"
          else
            docker push "$IMAGE"
          fi
          mkdir -p digests
          digest=$(oras resolve "$IMAGE")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          if [[ "$CHANNEL" == stable ]]; then [[ "$digest" == "${IMAGE_SCAN##*@}" ]]; fi
          printf '%s@%s\n' "$repository" "$digest" > "digests/$KIND.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.kind }}
          path: digests
  publish:
    needs: [version, images]
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel == 'stable' && 'stable-release' || 'candidate-release' }}
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: oras-project/setup-oras@v1
        with: {version: '1.3.0'}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - run: python -m pip install --require-hashes -r requirements/development.txt
      - run: python scripts/build-release.py --version "$VERSION" --digests digests --output downloads
      - name: Publish and verify OCI packages
        run: |
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for kind in training inference; do
            repository="ghcr.io/${GITHUB_REPOSITORY,,}/cwl/tile-sat-$kind"
            target="$repository:$VERSION"
            oras repo tags "$repository" > /tmp/cwl-tags 2>/tmp/registry-error || {
              grep -Eq 'NAME_UNKNOWN|name unknown|404' /tmp/registry-error || { cat /tmp/registry-error; exit 1; }
            }
            ! grep -Fxq "$VERSION" /tmp/cwl-tags
            file="tile-sat-$kind.$VERSION.cwl"
            (cd downloads && oras push --artifact-type application/cwl --annotation-file "$kind.annotations.json" "$target" "$file:application/cwl")
            digest=$(oras resolve "$target")
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            reference="$repository@$digest"
            oras pull "$reference" -o "verified/$kind"
            cmp "downloads/$file" "verified/$kind/$file"
            cwltool --validate "verified/$kind/$file#main"
            oras manifest fetch "$reference" > "downloads/$kind.manifest.json"
            jq -e --slurpfile expected "downloads/$kind.annotations.json" '.annotations as $actual | $expected[0]."$manifest" | to_entries | all(.[]; $actual[.key] == .value)' "downloads/$kind.manifest.json"
            printf '%s\n' "$reference" >> downloads/oci-artifacts.txt
          done
      - name: Create draft, attach verified artifacts, publish
        run: |
          flags=()
          if [[ "$CHANNEL" == candidate ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --draft "${flags[@]}" --notes-file CHANGELOG.md
          gh release upload "$VERSION" downloads/*
          gh release edit "$VERSION" --draft=false
