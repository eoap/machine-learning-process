[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "make-inference"
dynamic = ["version"]
description = "Inference module for the Tile-Based classification on Sentinel-2 data"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
keywords = ["inference", "Sentinel-2", "CNN", "EuroSAT"]
authors = [
    { name = "Parham Membari", email = "parham.membari@terradue.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
  "click>=8.1,<9",
  "pystac[validation] @ git+https://github.com/Terradue/pystac.git@t2_extensions",
  "numpy==1.26.4",
  "rasterio>=1.4,<2",
  "loguru>=0.7,<1",
  "tqdm>=4.66,<5",
  "rio-stac>=0.10,<1",
  "onnxruntime==1.31.0",
  "onnx==1.23.2",
  "planetary-computer>=1,<2"
]
readme = "README.md"

[project.urls]
Documentation = "https://github.com/eoap/machine-learning-process/docs/inference-container.md"
Issues = "https://github.com/eoap/machine-learning-process/issues"
Source = "https://github.com/eoap/machine-learning-process/inference/make-inference/src/make_inference"

[tool.hatch.version]
path = "src/make_inference/__about__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
packages = ["src/make_inference"]
include = [
  "src/make_inference/model/model.onnx",
]



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
testpaths = ["../../tests"]
addopts = "--import-mode=importlib"
[project.scripts]
make-inference = "make_inference.main:main"

[tool.hatch.envs.default]
dependencies = ["ipykernel>=6,<7"]

[tool.hatch.envs.prod]
dependencies = ["ipykernel>=6,<7"]

[tool.hatch.envs.prod.scripts]
inference = "python -m make_inference.main"

[tool.hatch.envs.dev]
skip-install = true
installer = "uv"
post-install-commands = ["cd ../.. && uv pip install --require-hashes -r requirements/development.txt", "cd ../.. && uv pip install --no-deps --no-build-isolation -e training/make-ml-model -e inference/make-inference -e MLM"]
template = "dev"
python = "3.12"

[tool.hatch.envs.dev.env-vars]
TF_NUM_INTRAOP_THREADS = "1"
TF_NUM_INTEROP_THREADS = "1"
CUDA_VISIBLE_DEVICES = "-1"

[tool.hatch.envs.dev.scripts]
check = ["bootstrap", "format-check", "lint-check", "typecheck", "security"]
format-check = "cd ../.. && ruff format --check training/make-ml-model/src inference/make-inference/src MLM/src scripts tests"
lint-check = "cd ../.. && ruff check training/make-ml-model/src inference/make-inference/src MLM/src scripts tests"
typecheck = "cd ../.. && mypy scripts/check-contracts.py scripts/create-fixture.py training/make-ml-model/src/tile_based_training/export.py MLM/src/mlm/describe.py scripts/stage-fixture.py"
security = "cd ../.. && bandit -r training/make-ml-model/src inference/make-inference/src MLM/src scripts -ll"
bootstrap = ["cd ../.. && uv pip install --require-hashes -r requirements/development.txt", "cd ../.. && uv pip install --no-deps --no-build-isolation -e training/make-ml-model -e inference/make-inference -e MLM"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
include = ["src/make_inference"]
packages = ["src/make_inference"]



[tool.hatch.envs.test]
template = "dev"

[tool.hatch.envs.test.scripts]
test = ["bootstrap", "cd ../.. && pytest -q {args}"]
[tool.coverage.run]
source_pkgs = ["make_inference"]
branch = true
parallel = true
omit = [
    "src/make_inference/__about__.py",
]

[tool.coverage.paths]
make_inference = ["src/make_inference", "*/make_inference/src/make_inference"]



artifacts = [
  "*.onnx",
]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]